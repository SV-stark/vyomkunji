version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/native-app"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      rust-crypto:
        patterns:
          - "cms"
          - "der"
          - "x509-cert"
          - "const-oid"
          - "sha1"
          - "sha2"
      rust-token:
        patterns:
          - "cryptoki"
          - "x509-parser"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/extension"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
