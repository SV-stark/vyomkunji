name: Release

on:
  push:
    tags:
      - "v*"
  # Manual escape hatch: a release can be re-run from an existing tag
  # (`gh workflow run release.yml --ref v0.4.1`) if the automatic run was
  # lost or failed. GITHUB_REF_NAME still resolves to the tag, so the
  # artifact names and the created release are identical to a tag push.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Package Release
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: native-app -> target

      - name: Verify tag matches package version
        shell: pwsh
        run: ./tools/check-version.ps1

      - name: Build Native Binaries (Release)
        working-directory: native-app
        run: cargo build --release

      - name: Sign Native Binaries
        shell: pwsh
        run: ./tools/sign-windows.ps1 -Path "native-app\target\release\vyomkunji.exe", "native-app\target\release\vyomkunji-host.exe"

      - name: Package Native Application
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $dist = "dist\vyomkunji-windows-x64"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          # Find binaries
          $binDir = if (Test-Path "native-app\target\release\vyomkunji.exe") {
            "native-app\target\release"
          } elseif (Test-Path "target\release\vyomkunji.exe") {
            "target\release"
          } else {
            throw "Could not locate compiled binaries"
          }

          Copy-Item "$binDir\vyomkunji.exe" -Destination $dist
          Copy-Item "$binDir\vyomkunji-host.exe" -Destination $dist
          Copy-Item "native-app\install-host.ps1" -Destination $dist
          Copy-Item "native-app\com.vyomkunji.host.json" -Destination $dist
          Copy-Item "native-app\com.vyomkunji.host.firefox.json" -Destination $dist
          Copy-Item "native-app\com.signer.host.json" -Destination $dist
          Copy-Item "native-app\com.signer.host.firefox.json" -Destination $dist
          Copy-Item "LICENSE" -Destination $dist
          Copy-Item "README.md" -Destination $dist

          Compress-Archive -Path "$dist\*" -DestinationPath "vyomkunji-$tag-windows-x64.zip" -Force
          Write-Host "Created vyomkunji-$tag-windows-x64.zip"

      - name: Package Chrome Extension
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          # Stage only the files the store needs: the test harness and the
          # package.json next to it must not ship.
          $staging = "dist\vyomkunji-chrome"
          Remove-Item $staging -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item "extension\manifest.json" -Destination $staging
          Copy-Item "extension\src" -Destination $staging -Recurse
          Copy-Item "extension\icons" -Destination $staging -Recurse
          Compress-Archive -Path "$staging\*" -DestinationPath "vyomkunji-chrome-$tag.zip" -Force
          Write-Host "Created vyomkunji-chrome-$tag.zip"

      - name: Package Firefox Extension
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $staging = "dist\vyomkunji-firefox-source"
          Remove-Item $staging -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item "extension-firefox\manifest.json" -Destination $staging
          Copy-Item "extension-firefox\src" -Destination $staging -Recurse
          Copy-Item "extension-firefox\icons" -Destination $staging -Recurse
          Compress-Archive -Path "$staging\*" -DestinationPath "vyomkunji-firefox-$tag.zip" -Force
          Write-Host "Created vyomkunji-firefox-$tag.zip"

      - name: Build Firefox XPI (Manifest V3 add-on package)
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          # Install with retries: a transient npm reset must not fail a release.
          npm install --no-save --no-audit --no-fund --fetch-retries=5 --fetch-retry-maxtimeout=120000 web-ext@8.3.0
          npx --no-install web-ext build --source-dir extension-firefox --artifacts-dir "dist" --overwrite-dest --filename "vyomkunji-firefox-$tag-mv3.zip"
          $built = "dist\vyomkunji-firefox-$tag-mv3.zip"
          if (-not (Test-Path $built)) { throw "web-ext did not produce a Firefox package" }
          Move-Item $built "dist\vyomkunji-firefox-$tag.xpi" -Force
          Write-Host "Created dist\vyomkunji-firefox-$tag.xpi"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress

      - name: Build Windows Installer
        shell: pwsh
        run: |
          $env:Path = "C:\Program Files (x86)\Inno Setup 6;$env:Path"
          iscc installer\vyomkunji.iss

      - name: Sign Windows Installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem "dist\vyomkunji-*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "Installer was not produced" }
          ./tools/sign-windows.ps1 -Path $installer.FullName

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $artifacts = @()
          $artifacts += Get-ChildItem -Path . -Filter "vyomkunji-*.zip"
          $artifacts += Get-ChildItem -Path "dist" -Filter "vyomkunji-*-setup.exe"
          $artifacts += Get-ChildItem -Path "dist" -Filter "vyomkunji-firefox-*.xpi"
          if ($artifacts.Count -eq 0) { throw "No release artifacts found" }
          $lines = foreach ($file in $artifacts) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content -Path "SHA256SUMS.txt" -Encoding ascii
          Get-Content "SHA256SUMS.txt"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            vyomkunji-*-windows-x64.zip
            vyomkunji-chrome-*.zip
            vyomkunji-firefox-*.zip
            dist\vyomkunji-firefox-*.xpi
            SHA256SUMS.txt
            dist\vyomkunji-*-setup.exe
          generate_release_notes: true
          draft: false
          prerelease: false
