name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  CARGO_TERM_COLOR: always

# The native app compiles with the Rust 2024 edition, which needs Rust 1.85 or
# newer. The `stable` toolchain used below always satisfies that requirement.

jobs:
  check-format:
    name: Format & Lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: native-app -> target

      - name: Check Formatting
        working-directory: native-app
        run: cargo fmt --check

      - name: Run Clippy
        working-directory: native-app
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: Unit Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: native-app -> target

      - name: Run Tests
        working-directory: native-app
        run: cargo test --all-targets

  extension:
    name: Extension Parity & Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.0.4
        with:
          node-version: "22"

      - name: Test background lifecycle
        run: node --test extension/tests/background.test.mjs extension/tests/manifest.test.mjs

      - name: Check extension trees and manifests
        shell: pwsh
        run: ./tools/check-extensions.ps1

      - name: Check version consistency
        shell: pwsh
        run: ./tools/check-version.ps1

      - name: Lint the Firefox MV3 add-on with web-ext
        run: npx --yes web-ext@8.3.0 lint --source-dir extension-firefox

      - name: Build the Firefox add-on package
        run: npx --yes web-ext@8.3.0 build --source-dir extension-firefox --artifacts-dir dist --overwrite-dest

  supply-chain:
    name: Supply Chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: native-app/Cargo.toml
          command: check

  build:
    name: Build Native Binaries
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: native-app -> target

      - name: Build Release
        working-directory: native-app
        run: cargo build --release
