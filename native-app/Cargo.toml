[package]
name = "signer-host"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "signer-host"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", features = ["oid"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
rsa = "0.9"
cryptoki = "0.6"
x509-parser = "0.16"
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
egui = "0.31"

