[package]
name = "vyomkunji"
version = "0.3.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "VyomKunji — India G2C Digital Signing"

[[bin]]
name = "vyomkunji-host"
path = "src/main.rs"

[[bin]]
name = "vyomkunji"
path = "src/bin/gui.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", features = ["oid"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
rsa = "0.9"
cryptoki = "0.6"
zeroize = { version = "1", features = ["derive"] }
x509-parser = "0.16"

# GUI stack
eframe = { version = "0.36.2", default-features = false, features = [
    "glow",
    "default_fonts",
    "wayland",
    "x11",
] }
egui = "0.36.2"

# fastframe: the shared foundation behind ZapFast/Spotifast (MIT, git tag).
fastframe-text = { git = "https://github.com/crmne/fastframe", tag = "v0.14.0" }
fastframe-fonts = { git = "https://github.com/crmne/fastframe", tag = "v0.14.0" }
fastframe-theme = { git = "https://github.com/crmne/fastframe", tag = "v0.14.0" }
fastframe-tray = { git = "https://github.com/crmne/fastframe", tag = "v0.14.0" }
fastframe-shell = { git = "https://github.com/crmne/fastframe", tag = "v0.14.0" }
# Default features are Linux-only (libappindicator / libxdo); Windows always
# gets the native Shell_NotifyIcon backend.
tray-icon = { version = "0.25", default-features = false }

# Smaller, faster-starting release binaries. Thin LTO and one codegen unit let
# the linker drop unused generic code; stripping removes debug symbols from the
# shipped executable. Keep the default unwind panics because the PKCS#11 loader
# relies on `catch_unwind` to survive misbehaving vendor modules.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
